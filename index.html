<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Godown Mobile Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f1f5f9; color: #0f172a;
    }
    main {
      width: min(100%, 440px); padding: 28px 22px;
      border-radius: 20px; background: white;
      box-shadow: 0 12px 35px rgba(15, 23, 42, .09);
      text-align: center;
    }
    .mark { font-size: 42px; }
    h1 { margin: 12px 0 8px; font-size: 25px; }
    p { color: #475569; line-height: 1.55; }
    .status {
      display: inline-block; margin-top: 12px; padding: 8px 12px;
      border-radius: 999px; background: #dcfce7; color: #166534;
      font-size: 14px; font-weight: 650;
    }
    small { display: block; margin-top: 22px; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">📦</div>
    <h1>Godown Mobile Scanner</h1>
    <p>Your mobile inventory scanner page has been created.</p>
    <div class="status">Page loaded successfully</div>
    <small>Camera scanning and staff sign-in will be added in the next steps.</small>
  </main>
</body>
</html>
